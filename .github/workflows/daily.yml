name: 每日精读上新

# 每天 00:20 UTC = 北京 08:20。避开整点可减轻 Actions 排队延迟。
# 内容来自多个官媒评论栏目（见 pipeline/fetch_sources.py），按「严格分论点」结构筛选。
# 注意：on 里绝对不要加 push —— 本工作流会自己 commit，避免自我触发死循环。
# 用内置 GITHUB_TOKEN 推送不会触发其它 Actions，但 Vercel 的 GitHub App 仍会正常构建。
on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD，留空=今天（北京时间）'
        required: false
        type: string
      pick:
        description: '改选文章：标题关键词'
        required: false
        type: string
      redo:
        description: '重做该日（覆盖已发布内容）'
        required: false
        type: boolean
        default: false
      require_essay:
        description: '抓稿窗口内无严格分论点达标文章则跳过上新'
        required: false
        type: boolean
        default: false
      sources:
        description: '限定来源 id，逗号分隔（rmrb,people_opinion,rmlt,gmw,ce,12371），留空=全部'
        required: false
        type: string

env:
  TZ: Asia/Shanghai
  INPUT_DATE: ${{ inputs.date }}
  INPUT_PICK: ${{ inputs.pick }}
  INPUT_REDO: ${{ inputs.redo }}
  INPUT_REQUIRE_ESSAY: ${{ inputs.require_essay }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  SITE_URL: ${{ vars.SITE_URL }}
  ESSAY_LOOKBACK_DAYS: ${{ vars.ESSAY_LOOKBACK_DAYS }}
  DAILY_SOURCES: ${{ vars.DAILY_SOURCES }}
  INPUT_SOURCES: ${{ inputs.sources }}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # 流水线只用标准库，无需 pip install

      - name: 幂等检查
        id: guard
        shell: bash
        run: |
          D="${INPUT_DATE:-}"
          if [ -z "$D" ]; then D=$(date +%F); fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
          FILE="frontend/public/content/daily/${D}.json"
          if [ "$INPUT_REDO" != "true" ] && [ -f "$FILE" ]; then
            if python3 -c "import json,sys; sys.exit(0 if json.load(open('$FILE'))['status']=='published' else 1)"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "当天已发布，跳过生成（可用 redo=true 覆盖）"
            fi
          fi

      - name: 生成讲义（多官媒抓稿 → 严格结构选文 → 逐段生成 → 门禁 → 入库）
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          ARGS=(--out frontend/public/content/daily --raw-out frontend/public/content/raw)
          [ -n "$INPUT_DATE" ] && ARGS+=(--date "$INPUT_DATE")
          [ -n "$INPUT_PICK" ] && ARGS+=(--pick "$INPUT_PICK")
          [ "$INPUT_REDO" = "true" ] && ARGS+=(--redo)
          [ "$INPUT_REQUIRE_ESSAY" = "true" ] && ARGS+=(--require-essay)
          SRC="${INPUT_SOURCES:-$DAILY_SOURCES}"
          [ -n "$SRC" ] && ARGS+=(--sources "$SRC")
          [ -n "$ESSAY_LOOKBACK_DAYS" ] && ARGS+=(--essay-lookback "$ESSAY_LOOKBACK_DAYS")
          python3 pipeline/generate_daily.py "${ARGS[@]}"

      - name: 全量质量校验
        if: steps.guard.outputs.skip != 'true'
        run: python3 pipeline/validate_daily.py --dir frontend/public/content/daily

      - name: 提交上新（触发 Vercel 构建）
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name 'daily-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add frontend/public/content/daily/
          if git diff --cached --quiet; then
            echo "无内容变更，不 commit"
            exit 0
          fi
          git commit -m "daily: ${{ steps.guard.outputs.date }} 精读上新"
          git push

      - name: 失败留痕（draft 与诊断信息）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-draft-${{ steps.guard.outputs.date }}
          path: frontend/public/content/daily/
          if-no-files-found: ignore

      - name: 运行摘要
        if: always()
        shell: bash
        run: |
          {
            echo "## 每日精读上新 · ${{ steps.guard.outputs.date }}"
            echo "- 跳过（已发布）：${{ steps.guard.outputs.skip == 'true' }}"
            echo "- 结果：${{ job.status }}"
            echo "- 失败时请查看 artifact 中的 draft JSON 与 qualityReport，"
            echo "  或用 workflow_dispatch 的 pick / redo 手动重跑。"
          } >> "$GITHUB_STEP_SUMMARY"
